schema: bota-short-benchmark-v1
test_access_policy: forbidden
output_root: outputs/amz_v4/k2k4
source:
  dataset: amazon_movies_tv_titles_exploratory_newuser_v4
  raw_data: data/Amazon_Reviews_2023_Movies_and_TV
  train_json: outputs/bota_amazon_movies_tv_v4/prepared/amazon_movies_tv_newusers_seed42_v4/train.json
  development_json: outputs/bota_amazon_movies_tv_v4/prepared/amazon_movies_tv_newusers_seed42_v4/development.json
  train_user_ids: outputs/bota_amazon_movies_tv_v4/prepared/amazon_movies_tv_newusers_seed42_v4/train_user_ids.json
  development_user_ids: outputs/bota_amazon_movies_tv_v4/prepared/amazon_movies_tv_newusers_seed42_v4/development_user_ids.json
  raw_lineage_manifest: outputs/bota_amazon_movies_tv_v4/prepared/amazon_movies_tv_newusers_seed42_v4/manifest.json
  original_checkpoint: outputs/bota_amazon_movies_tv_v3/originals/amazon_movies_tv_titles_original_p5_seed42_v3/model
  base_config: configs/bota_if/p1_trajectory_transport_amazon_v4.yaml
  trajectory_config: configs/bota_if/p3b_full_trajectory_v1.yaml
protocol:
  seed: 42
  optimizer_steps: 200
  batch_size: 16
  interactions: 3200
  request_users: [2, 4]
  minimum_development_samples_per_user: 5
  require_one_window_exposure_per_user: false
  minimum_window_exposure_per_user: 2
  maximum_window_exposure_per_user: 5
  scenarios:
    - {id: K2, composition: {low: 1, middle: 1, high: 0}}
    - {id: K4, composition: {low: 2, middle: 2, high: 0}}
  frequency_rule: adaptation_train_frequency_then_user_hash_equal_count_terciles
  selection_fields: [train_user_frequency, window_exposure, development_user_count]
  selection_uses_labels_or_predictions: false
coordinate:
  target_modules: [q, v]
  rank: 16
  alpha: 32
  trainable: B_only
  initial_B: zero
  fixed_a_seed: 42
optimizer:
  name: AdamW
  learning_rate: 0.001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  scheduler: none
methods:
  Original-Short: {kind: fixed_ab_canonical, optimizer_steps_per_scenario: 200}
  Retrain-Short: {kind: fixed_ab_masked, optimizer_steps_per_scenario: 200}
  IFRU-Short-LoRA: {kind: ifru_fixed_ab, online_optimizer_steps: 0, curvature_panel_samples: 512, cg_max_iterations: 40}
  BOTA-T2-Short: {kind: bota_t2, optimizer_steps_per_scenario: 200, online_optimizer_steps: 0}
evaluation:
  split: Development
  final_test: false
  inference_batch_size: 4
  bootstrap_resamples: 1000
runtime:
  required_cuda_devices: 1
  minimum_free_gib: 10.0
  allocator_fraction: 0.88
  hard_peak_reserved_gib: 14.0

