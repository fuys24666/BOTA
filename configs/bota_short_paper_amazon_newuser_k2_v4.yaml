schema: bota-short-paper-v2
test_access_policy: forbidden
output_root: outputs/amz_v4/paper_k2
source:
  v1_config: configs/bota_short_amazon_movies_newuser_k2k4_v4.yaml
  v1_benchmark_name: amz_new_k2k4_s42_v4
protocol:
  seed: 42
  window_samples: 3200
  deleted_samples: 2
  batch_size: 16
  physical_microbatch: 4
  gradient_accumulation: 4
  learning_rate: 0.001
  max_epochs: 100
  patience: 5
  min_delta: 0.0
  validation_batch_size: 4
  neggrad_steps: 200
  neggrad_forget_weight: 0.2
  pcgrad_steps: 200
  pcgrad_projection: deterministic_symmetric_two_task
coordinate:
  target_modules: [q, v]
  rank: 16
  alpha: 32
  trainable: B_only
  initial_B: zero
evaluation:
  split: Development
  final_test: false
  inference_batch_size: 4
  bootstrap_resamples: 1000
runtime:
  minimum_free_gib: 10.0
  hard_peak_reserved_gib: 14.0

