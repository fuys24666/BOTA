[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bota-unlearning"
version = "0.1.0"
description = "Blockwise optimizer-aware trajectory amortization for online user unlearning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "pandas==2.3.3",
  "psutil==7.2.2",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "sentencepiece==0.1.99",
  "transformers==4.57.6",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
